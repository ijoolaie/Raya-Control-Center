name: CI

on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-windows:
    name: Node ${{ matrix.node-version }} / Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Windows data ACL helper test
        shell: pwsh
        run: ./test-support/test-data-acl.ps1

  test-linux:
    name: Node ${{ matrix.node-version }} / Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: npm run check
      - name: Test (including real POSIX directory fsync)
        run: npm test
